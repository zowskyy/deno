[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gateway-probe"
version = "0.1.0"
description = "Read-only network diagnostic tool for OpenWrt / Linux gateways"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "William Boyd", email = "the.william.boyd.93@gmail.com" }]
keywords = ["networking", "openwrt", "diagnostics", "cake", "bufferbloat"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking :: Monitoring",
]

dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov",
  "jsonschema>=4.0",
]

[project.scripts]
gateway-probe = "probe.cli:main"
gateway-probe-serve = "probe.api:main"
gateway-probe-compare = "probe.compare:main"
gateway-probe-safety = "probe.safety:main"
gateway-probe-devices = "probe.devices_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["probe"]
artifacts = ["probe/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["probe"]
branch = true
