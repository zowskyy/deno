<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>gateway-probe dashboard</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 2rem;
    background: Canvas;
    color: CanvasText;
  }
  h1 { font-size: 1.25rem; margin: 0 0 0.25rem; }
  h2 { font-size: 1rem; margin: 2rem 0 0.75rem; }
  .subtitle { opacity: 0.6; margin-bottom: 1.5rem; font-size: 0.875rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }
  .card { border: 1px solid color-mix(in srgb, CanvasText 15%, transparent); border-radius: 8px; padding: 1rem; }
  .card .label { font-size: 0.75rem; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.04em; }
  .card .value { font-size: 1.5rem; font-weight: 600; margin-top: 0.25rem; }
  .card .sub { font-size: 0.75rem; opacity: 0.6; margin-top: 0.25rem; }
  .ok { color: #16a34a; }
  .warn { color: #d97706; }
  .bad { color: #dc2626; }
  table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid color-mix(in srgb, CanvasText 10%, transparent); }
  ul.findings { list-style: none; margin: 0; padding: 0; }
  ul.findings li {
    margin-bottom: 0.75rem;
    padding: 0.75rem;
    border: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
    border-radius: 6px;
  }
  .confidence { opacity: 0.6; font-size: 0.8em; }
  #status { font-size: 0.8rem; opacity: 0.6; margin-top: 2rem; }
  code { background: color-mix(in srgb, CanvasText 10%, transparent); padding: 0.1rem 0.3rem; border-radius: 4px; }
</style>
</head>
<body>
  <h1>gateway-probe</h1>
  <div class="subtitle">Read-only diagnostics — observes and recommends, never changes firewall or QoS settings.</div>

  <div id="latest">Loading…</div>

  <h2>History</h2>
  <table id="history">
    <thead><tr><th>Time</th><th>Mode</th><th>Interface</th><th>Findings</th><th>Top finding</th></tr></thead>
    <tbody></tbody>
  </table>

  <h2>Devices on your network</h2>
  <div id="devices">Loading…</div>

  <h2>Recent activity</h2>
  <div id="activity">Loading…</div>

  <p id="storage"></p>
  <p id="status"></p>

<script>
const REFRESH_MS = 5000;

function statusClass(ok) { return ok ? "ok" : "bad"; }
function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

function renderLatest(report) {
  const el = document.getElementById("latest");
  if (!report || report.error) {
    el.innerHTML = "<p>No reports yet. Run <code>gateway-probe --store report.db</code> to collect one.</p>";
    return;
  }
  const iface = report.interface || {};
  const routing = report.routing || {};
  const latency = report.latency || {};
  const dns = report.dns || {};
  const qdisc = report.qdisc || {};
  const findings = report.findings || [];

  const lossVal = latency.loss_percent;
  const cards = [
    { label: "Interface", value: esc(iface.name || "?"), cls: iface.carrier ? "ok" : "bad" },
    { label: "Default route", value: routing.default_route_present ? "present" : "missing", cls: statusClass(routing.default_route_present) },
    { label: "Gateway RTT p95", value: (latency.gateway_p95_ms ?? "—") + " ms", cls: "" },
    { label: "Public RTT p95", value: (latency.public_p95_ms ?? "—") + " ms", cls: "" },
    { label: "Packet loss", value: (lossVal ?? "—") + "%", cls: (lossVal ?? 0) > 5 ? "bad" : "ok" },
    { label: "DNS", value: dns.success ? "ok" : "failed", cls: statusClass(dns.success) },
    { label: "CAKE", value: qdisc.cake_detected ? "active" : "not detected", cls: qdisc.cake_detected ? "ok" : "warn" },
  ];

  let html = '<div class="grid">' + cards.map(c =>
    `<div class="card"><div class="label">${esc(c.label)}</div><div class="value ${c.cls}">${c.value}</div></div>`
  ).join("") + "</div>";

  html += "<h2>Findings</h2>";
  if (findings.length === 0) {
    html += "<p class='ok'>No significant issues detected.</p>";
  } else {
    html += "<ul class='findings'>" + findings.map(f =>
      `<li><strong>${esc(f.category)}</strong> <span class="confidence">(${Math.round(f.confidence * 100)}% confidence)</span><br>${esc(f.interpretation)}</li>`
    ).join("") + "</ul>";
  }

  el.innerHTML = html;
}

function renderHistory(rows) {
  const tbody = document.querySelector("#history tbody");
  if (!Array.isArray(rows)) { tbody.innerHTML = ""; return; }
  tbody.innerHTML = rows.map(r =>
    `<tr><td>${esc(r.timestamp)}</td><td>${esc(r.mode)}</td><td>${esc(r.wan_interface)}</td><td>${esc(r.finding_count)}</td><td>${esc(r.top_finding_category || "—")}</td></tr>`
  ).join("");
}

function deviceLabel(d) {
  if (d.vendor) return d.vendor;
  if (d.type === "randomized_private") return "Private device (identity hidden for privacy)";
  return "Unknown vendor";
}

function timeAgo(iso) {
  if (!iso) return "—";
  const then = new Date(iso).getTime();
  if (isNaN(then)) return esc(iso);
  const mins = Math.round((Date.now() - then) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  const hours = Math.round(mins / 60);
  if (hours < 24) return hours + "h ago";
  return Math.round(hours / 24) + "d ago";
}

function renderDevices(data) {
  const el = document.getElementById("devices");
  if (!data || !data.configured) {
    el.innerHTML = "<p>Device tracking isn't set up yet. Run <code>gateway-probe-devices --store devices.db</code> to start seeing what's on your network.</p>";
    return;
  }
  if (!data.available || !Array.isArray(data.devices) || data.devices.length === 0) {
    el.innerHTML = "<p>No device scans recorded yet.</p>";
    return;
  }

  const rows = data.devices.map(d =>
    `<tr class="${d.present ? "" : "warn"}"><td>${esc(deviceLabel(d))}</td><td>${esc(d.last_ip || "—")}</td><td>${timeAgo(d.last_seen)}</td><td>${d.present ? "here now" : "not seen currently"}</td></tr>`
  ).join("");

  const presentCount = data.devices.filter(d => d.present).length;

  el.innerHTML =
    `<p>${presentCount} device${presentCount === 1 ? "" : "s"} currently on your network (${data.device_count} seen in total).</p>` +
    `<table><thead><tr><th>Device</th><th>Last IP</th><th>Last seen</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function eventLabel(e) {
  const who = e.vendor || (e.type === "randomized_private" ? "A private device" : "An unrecognized device");
  if (e.event_type === "device_new") return `${who} joined your network for the first time`;
  if (e.event_type === "device_returned") return `${who} came back online`;
  if (e.event_type === "device_missing") return `${who} hasn't been seen since`;
  return `${who}: ${esc(e.event_type)}`;
}

function renderActivity(data) {
  const el = document.getElementById("activity");
  const events = (data && data.recent_events) || [];
  if (!data || !data.configured) {
    el.innerHTML = "<p>Nothing to show yet.</p>";
    return;
  }
  if (events.length === 0) {
    el.innerHTML = "<p>No activity recorded yet — this fills in as devices join, leave, and come back over time.</p>";
    return;
  }
  el.innerHTML = "<ul class='findings'>" + events.map(e =>
    `<li>${esc(eventLabel(e))}<br><span class="confidence">${timeAgo(e.timestamp)}</span></li>`
  ).join("") + "</ul>";
}

function renderStorage(storage) {
  const el = document.getElementById("storage");
  if (!el || !storage) return;
  const mb = (storage.database_bytes / (1024 * 1024)).toFixed(2);
  const cls = storage.retention_status === "healthy" ? "ok" : "bad";
  el.innerHTML = `<span class="${cls}">${esc(storage.retention_status)}</span> — database: ${mb} MB`;
}

// Fetches and parses one endpoint, tagging the failure so callers can tell
// "the server is unreachable" (network/CORS failure, fetch() itself rejects)
// apart from "the server responded with something that isn't valid JSON"
// (truncated response, wrong content behind a misconfigured proxy, etc.) —
// these need different messages, since only one of them means "is the
// server process even running?"
async function fetchJSON(url) {
  let res;
  try {
    res = await fetch(url);
  } catch (e) {
    throw { kind: "network", detail: e };
  }
  try {
    return await res.json();
  } catch (e) {
    throw { kind: "parse", detail: e };
  }
}

function panelErrorMessage(kind) {
  return kind === "network"
    ? "Can't reach the gateway-probe server — is it still running?"
    : "The server sent back something unexpected. Try refreshing the page.";
}

// Each panel's fetch/render is isolated: one endpoint failing (e.g. a
// corrupt device store) must not leave the other panels stuck on
// "Loading…" forever, and must not block them from refreshing on the
// next tick either.
async function refresh() {
  const [latestResult, historyResult, devicesResult] = await Promise.allSettled([
    fetchJSON("/api/reports/latest"),
    fetchJSON("/api/reports"),
    fetchJSON("/api/devices"),
  ]);

  if (latestResult.status === "fulfilled") {
    renderLatest(latestResult.value);
  } else {
    document.getElementById("latest").innerHTML =
      `<p class="bad">${esc(panelErrorMessage(latestResult.reason.kind))}</p>`;
  }

  if (historyResult.status === "fulfilled") {
    renderHistory(historyResult.value.reports);
    renderStorage(historyResult.value.storage);
  } else {
    document.querySelector("#history tbody").innerHTML =
      `<tr><td colspan="5" class="bad">${esc(panelErrorMessage(historyResult.reason.kind))}</td></tr>`;
  }

  if (devicesResult.status === "fulfilled") {
    renderDevices(devicesResult.value);
    renderActivity(devicesResult.value);
  } else {
    const msg = `<p class="bad">${esc(panelErrorMessage(devicesResult.reason.kind))}</p>`;
    document.getElementById("devices").innerHTML = msg;
    document.getElementById("activity").innerHTML = msg;
  }

  const results = [latestResult, historyResult, devicesResult];
  const anyFailed = results.some(r => r.status === "rejected");
  const anySucceeded = results.some(r => r.status === "fulfilled");
  const statusEl = document.getElementById("status");
  if (anyFailed && !anySucceeded) {
    statusEl.textContent = "Connection error — retrying every " + (REFRESH_MS / 1000) + "s";
  } else if (anyFailed) {
    statusEl.textContent = "Updated " + new Date().toLocaleTimeString() + " (some panels failed to load — see above)";
  } else {
    statusEl.textContent = "Updated " + new Date().toLocaleTimeString();
  }
}

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
